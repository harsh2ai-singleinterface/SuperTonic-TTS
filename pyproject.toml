[project]
name = "supertonic-server"
version = "0.0.1"
description = "Cartesia-shaped streaming TTS server backed by on-device Supertonic"
requires-python = ">=3.12"
dependencies = [
    "supertonic>=1.3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.13",
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
# GPU/CUDA inference. NOTE: `onnxruntime-gpu` ships the same `onnxruntime`
# import package as the CPU `onnxruntime` that `supertonic` pulls in — the
# CPU one must be uninstalled first. See requirements-gpu.txt for the
# required install order.
gpu = [
    "onnxruntime-gpu>=1.26",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
    "nvidia-cudnn-cu12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supertonic_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "slow: tests that load the Supertonic model and run real synthesis (multi-second)",
]
